name: Quality

# Runs the same gate as `./scripts/ci.sh` locally, so a green pull request
# means the checks passed with the rules in this repository — not a
# CI-only subset of them.
#
# This workflow is read-only: it does not tag, bump, publish, or merge.
# Release automation stays in version_bump.yml and build.yml.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the `environment:` block in pubspec.yaml.
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the quality gate
        run: ./scripts/ci.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore
